<div class="min-h-screen bg-slate-50 text-slate-900 pb-16">
  <!-- Header / Navbar Principal -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <!-- Logo y Título -->
      <div class="flex items-center space-x-6">
        <a routerLink="/dashboard" class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white font-bold text-xl shadow-md">
            $
          </div>
          <div>
            <h1 class="text-lg sm:text-xl font-bold tracking-tight text-slate-800 leading-tight">App Gastos</h1>
            <p class="text-[11px] text-slate-500 hidden sm:block">Control mensual, impuestos y tarjetas</p>
          </div>
        </a>

        <!-- Navegación entre Pantallas -->
        <nav class="flex items-center space-x-1 bg-slate-100 p-1 rounded-xl">
          <a routerLink="/dashboard"
             routerLinkActive="bg-white text-slate-900 shadow-xs font-semibold"
             class="px-3.5 py-1.5 rounded-lg text-xs sm:text-sm text-slate-600 hover:text-slate-900 transition-all">
            📊 Dashboard Mensual
          </a>
          <a routerLink="/expenses"
             routerLinkActive="bg-white text-slate-900 shadow-xs font-semibold"
             class="px-3.5 py-1.5 rounded-lg text-xs sm:text-sm text-slate-600 hover:text-slate-900 transition-all">
            🔎 Grilla de Consultas
          </a>
        </nav>
      </div>

      <!-- Usuario y Estado de Conexión -->
      <div class="flex items-center space-x-3">
        @if (auth.currentUser(); as user) {
          <div class="hidden md:flex items-center space-x-2 text-xs bg-slate-100 text-slate-700 px-3 py-1.5 rounded-full font-medium">
            <span class="w-2 h-2 rounded-full bg-blue-500"></span>
            <span>{{ user.name }}</span>
          </div>
        }

        <div class="flex items-center space-x-2 text-xs font-medium px-3 py-1.5 rounded-full border"
             [ngClass]="{
               'bg-emerald-50 text-emerald-700 border-emerald-200': backendStatus() === 'connected',
               'bg-amber-50 text-amber-700 border-amber-200': backendStatus() === 'checking',
               'bg-rose-50 text-rose-700 border-rose-200': backendStatus() === 'disconnected'
             }">
          <span class="w-2 h-2 rounded-full"
                [ngClass]="{
                  'bg-emerald-500 animate-pulse': backendStatus() === 'connected',
                  'bg-amber-500 animate-pulse': backendStatus() === 'checking',
                  'bg-rose-500': backendStatus() === 'disconnected'
                }"></span>
          <span class="hidden sm:inline">
            {{ backendStatus() === 'connected' ? 'PostgreSQL Conectado' : backendStatus() === 'checking' ? 'Conectando...' : 'Sin conexión' }}
          </span>
        </div>
      </div>
    </div>
  </header>

  <!-- Contenido Dinámico de la Ruta Activa -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
    <router-outlet></router-outlet>
  </main>
</div>
